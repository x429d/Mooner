name: Mooner
options:
  bundleIdPrefix: com.suze
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # No team committed: contributors pick their own in Xcode or pass
    # DEVELOPMENT_TEAM=… / CODE_SIGNING_ALLOWED=NO on the command line.
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  Mooner:
    type: application
    platform: macOS
    sources:
      - path: Mooner
      - path: Shared
    dependencies:
      - target: MoonerWidget
        embed: true
    info:
      path: Support/Mooner-Info.plist
      properties:
        CFBundleDisplayName: Mooner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.weather
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    entitlements:
      path: Support/Mooner.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suze.Mooner
        PRODUCT_NAME: Mooner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  MoonerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: MoonerWidget
      - path: Shared
    info:
      path: Support/MoonerWidget-Info.plist
      properties:
        CFBundleDisplayName: Mooner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/MoonerWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suze.Mooner.Widget
        PRODUCT_NAME: MoonerWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  MoonerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MoonerTests
    dependencies:
      - target: Mooner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suze.MoonerTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mooner:
    build:
      targets:
        Mooner: all
        MoonerWidget: all
        MoonerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoonerTests
    archive:
      config: Release
